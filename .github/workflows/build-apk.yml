name: build-apk

# Compiles mod/src/mk (the Liquid Glass controls), injects it as classes8.dex,
# rebuilds the APK from the decoded tree, signs it, commits it and publishes it
# as a release asset.
on:
  push:
    paths:
      - "mod/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip-ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve Android SDK (android.jar, d8, zipalign, apksigner)
        id: sdk
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK/build-tools" ]; then
            echo "no preinstalled SDK, fetching command line tools"
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
              "platforms;android-35" "build-tools;35.0.0"
          fi
          echo "SDK=$SDK"
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          JAR=$(ls -d "$SDK"/platforms/android-*/android.jar 2>/dev/null | sort -V | tail -1)
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          [ -n "$JAR" ] && [ -n "$BT" ] || { echo "no android.jar/build-tools found" >&2; exit 1; }
          "$BT/d8" --version
          echo "ANDROID_JAR=$JAR" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"

      - name: Install apktool
        run: bash scripts/install_tools.sh 2>&1 | tail -4

      - name: Render control preview (AWT, same geometry constants)
        continue-on-error: true
        run: java mod/preview/GlassPreview.java mod/preview

      - name: Build Liquid Glass APK
        run: |
          set -o pipefail
          bash mod/build.sh 2>&1 | tee mod/build.log

      - name: Collect result
        if: always()
        run: |
          mkdir -p mod
          {
            echo "sha256: $(sha256sum build/iboard-liquidglass.apk 2>/dev/null || echo missing)"
            ls -l build/ 2>/dev/null || true
          } > mod/result.txt
          cat mod/result.txt

      - name: Commit APK, keystore and log
        if: always()
        run: |
          git config user.name "igboard-builder"
          git config user.email "builder@users.noreply.github.com"
          git add -A build mod 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "build: liquid glass controls (classes8.dex) [skip-ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            sleep 10
          done

      - name: Publish release asset
        if: success()
        run: |
          TAG="liquid-glass-v1"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "iBoard Liquid Glass build" \
              --target "$GITHUB_REF_NAME" \
              --notes "Settings toggles and sliders rebuilt as Liquid Glass controls.

          * track 64x28dp capsule, thumb 40x24dp capsule (Kyant0/AndroidLiquidGlass parameters)
          * accent #34C759 light / #30D158 dark, track #787878 @20% / #787880 @36%
          * slider track 6dp, accent #0088FF / #0091FF
          * shadow 4dp @5% with radius/6 offset, 0.5dp specular rim, pressed lens + inner shadow
          * shipped as classes8.dex, hooked from eux/SwitchCompat/MaterialSwitch

          This is an unsigned-for-Play, self-signed unofficial modification of Gboard.
          Uninstall or disable the stock Gboard before installing."
          fi
          gh release upload "$TAG" build/iboard-liquidglass.apk --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
