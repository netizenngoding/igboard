name: decompile

# Strips build/iboard.apk down to its bones on a GitHub runner (the APK itself is
# Git LFS content, so this is where the real bytes are available) and commits the
# result back onto the branch that triggered the run.
on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/decompile.yml"
      - "build/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decompile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decompile:
    if: "!contains(github.event.head_commit.message, '[skip-ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout (with LFS payload)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Confirm the APK is real, not an LFS pointer
        run: |
          ls -l build/
          stat -c '%s bytes' build/iboard.apk
          head -c 4 build/iboard.apk | od -An -c
          test "$(stat -c '%s' build/iboard.apk)" -gt 1000000
          sha256sum build/iboard.apk

      - name: Install toolchain (apktool + jadx)
        run: |
          set -o pipefail
          mkdir -p analysis/logs
          bash scripts/install_tools.sh 2>&1 | tee analysis/logs/00-install.log

      - name: Decompile (raw + apktool + jadx + ELF + reports)
        run: |
          set -o pipefail
          bash scripts/decompile_apk.sh build/iboard.apk 2>&1 | tee analysis/logs/01-decompile.log

      - name: REA evidence (best effort)
        continue-on-error: true
        run: |
          mkdir -p analysis/evidence
          npx -y rea-agents@6.8.0 inspect-apk-signature build/iboard.apk \
            --format json --full-output > analysis/evidence/apk-signature.json 2> analysis/evidence/apk-signature.err || true
          npx -y rea-agents@6.8.0 inspect-android-package build/iboard.apk \
            --format json --full-output > analysis/evidence/android-package.json 2> analysis/evidence/android-package.err || true
          ls -l analysis/evidence

      - name: Guard repository size
        run: |
          du -sm decompiled analysis | tee /tmp/sizes.txt
          total=$(du -sm decompiled | cut -f1)
          echo "decompiled total: ${total} MB"
          if [ "$total" -gt 1800 ]; then
            echo "::warning::decompiled tree is ${total} MB - archiving jadx sources"
            tar -C decompiled/jadx -czf decompiled/jadx-sources.tar.gz sources 2>/dev/null || true
            rm -rf decompiled/jadx/sources
            printf 'jadx sources exceeded the repository budget and are archived in jadx-sources.tar.gz\n' \
              > decompiled/jadx/SOURCES-ARCHIVED.md
          fi

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p analysis/logs
          du -sh decompiled/* analysis/* 2>/dev/null > analysis/logs/02-sizes.log || true
          df -h / > analysis/logs/03-disk.log || true
          ls -la decompiled > analysis/logs/04-tree.log 2>&1 || true

      - name: Commit and push results
        if: always()
        run: |
          git config user.name "igboard-decompiler"
          git config user.email "decompiler@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "decompile: full teardown of build/iboard.apk [skip-ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt $attempt"
              break
            fi
            sleep 10
          done

      - name: Summary
        run: |
          {
            echo "### Decompiled build/iboard.apk"
            du -sh decompiled/* | sed 's/^/    /'
            echo
            cat /tmp/sizes.txt
          } >> "$GITHUB_STEP_SUMMARY"
