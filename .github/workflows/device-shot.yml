name: device-shot

# Builds the Liquid Glass APK, boots an emulator, installs it, opens iBoard
# settings and commits screenshots plus logcat. This is how the controls get
# looked at without an arm64 device in the loop.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/device-shot.yml"

permissions:
  contents: write

concurrency:
  group: device-shot
  cancel-in-progress: false

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          JAR=$(ls -d "$SDK"/platforms/android-*/android.jar | sort -V | tail -1)
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          echo "ANDROID_JAR=$JAR" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Install apktool
        run: bash scripts/install_tools.sh 2>&1 | tail -3

      - name: Build Liquid Glass APK
        run: |
          set -o pipefail
          bash mod/build.sh 2>&1 | tee mod/build.log

      - name: Make an emulator-testable copy (x86_64)
        run: |
          set -euo pipefail
          mkdir -p mod/shots
          cp build/iboard-liquidglass.apk mod/shots/arm.apk
          # The payload is arm64-only and an APK whose only native libs target a
          # foreign ABI is refused by x86_64 emulators. Strip lib/ for the UI test,
          # then re-align and re-sign because touching the zip breaks the digests.
          cp mod/shots/arm.apk mod/shots/test.apk
          zip -q -d mod/shots/test.apk 'lib/*' || true
          "$BUILD_TOOLS/zipalign" -p -f 4 mod/shots/test.apk mod/shots/test-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks build/keys/iboard-test.jks \
            --ks-pass pass:iboard --key-pass pass:iboard --ks-key-alias IBOARD-T \
            --out mod/shots/test-signed.apk mod/shots/test-aligned.apk
          "$BUILD_TOOLS/apksigner" verify mod/shots/test-signed.apk | head -3
          ls -l mod/shots

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Emulator run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -x
            PKG=com.google.android.inputmethod.latin
            ACT=$PKG/com.google.android.apps.inputmethod.latin.preference.SettingsActivity
            adb logcat -c || true
            adb install -r -d mod/shots/test-signed.apk || adb install -r mod/shots/test-signed.apk || true
            adb shell pm list packages | grep inputmethod || true
            adb shell ime enable $PKG/com.android.inputmethod.latin.LatinIME || true
            adb shell ime set $PKG/com.android.inputmethod.latin.LatinIME || true
            adb shell am start -W -n $ACT || true
            sleep 12
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
            adb exec-out screencap -p > mod/shots/settings-light.png || true
            adb logcat -d -v brief > mod/shots/logcat.txt || true
            grep -i iboardglass mod/shots/logcat.txt | tail -40 || true
            adb shell cmd uimode night yes || true
            sleep 5
            adb shell am start -W -n $ACT || true
            sleep 10
            adb exec-out screencap -p > mod/shots/settings-dark.png || true
            adb logcat -d -v brief > mod/shots/logcat-after.txt || true
            ls -l mod/shots

      - name: Commit screenshots and logs
        if: always()
        run: |
          git config user.name "igboard-device"
          git config user.email "device@users.noreply.github.com"
          rm -f mod/shots/arm.apk mod/shots/test.apk mod/shots/test-aligned.apk mod/shots/test-signed.apk
          git add -A mod/shots mod/build.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "device: settings screenshots + logcat [skip-ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            sleep 10
          done
