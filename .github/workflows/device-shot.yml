name: device-shot

# Builds the Liquid Glass APK, boots an emulator, installs it, opens iBoard
# settings and commits screenshots plus logcat. This is how the controls get
# looked at without an arm64 device in the loop.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/device-shot.yml"

permissions:
  contents: write

concurrency:
  group: device-shot
  cancel-in-progress: false

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          JAR=$(ls -d "$SDK"/platforms/android-*/android.jar | sort -V | tail -1)
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          echo "ANDROID_JAR=$JAR" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Install apktool
        run: bash scripts/install_tools.sh 2>&1 | tail -3

      - name: Build Liquid Glass APK
        run: |
          set -o pipefail
          bash mod/build.sh 2>&1 | tee mod/build.log

      - name: Make an emulator-testable copy (x86_64)
        run: |
          set -euo pipefail
          mkdir -p mod/shots
          cp build/iboard-liquidglass.apk mod/shots/arm.apk
          # The payload is arm64-only and an APK whose only native libs target a
          # foreign ABI is refused by x86_64 emulators. Strip lib/ for the UI test,
          # then re-align and re-sign because touching the zip breaks the digests.
          cp mod/shots/arm.apk mod/shots/test.apk
          zip -q -d mod/shots/test.apk 'lib/*' || true
          "$BUILD_TOOLS/zipalign" -p -f 4 mod/shots/test.apk mod/shots/test-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks build/keys/iboard-test.jks \
            --ks-pass pass:iboard --key-pass pass:iboard --ks-key-alias IBOARD-T \
            --out mod/shots/test-signed.apk mod/shots/test-aligned.apk
          "$BUILD_TOOLS/apksigner" verify mod/shots/test-signed.apk | head -3
          ls -l mod/shots

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install emulator packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(command -v sdkmanager)
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "emulator" "system-images;android-31;google_apis;x86_64"
          ls "$SDK/emulator/emulator" "$SDK/platform-tools/adb"

      - name: Boot emulator and capture
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$SDK/platform-tools:$SDK/emulator:$PATH"
          echo "no" | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n test \
            -k "system-images;android-31;google_apis;x86_64" -d pixel_5 --force || true
          "$SDK/emulator/emulator" -avd test -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -accel on -camera-back none \
            > mod/shots/emulator-launch.log 2>&1 &
          adb wait-for-device
          timeout 420 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell input keyevent 82 || true
          OUT="$PWD/mod/shots" GITHUB_WORKSPACE="$PWD" bash mod/shots/run-emulator.sh 2>&1 | tee mod/shots/emulator.log

      - name: Commit screenshots and logs
        if: always()
        run: |
          git config user.name "igboard-device"
          git config user.email "device@users.noreply.github.com"
          rm -f mod/shots/arm.apk mod/shots/test.apk mod/shots/test-aligned.apk mod/shots/test-signed.apk
          git add -A mod/shots mod/build.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "device: settings screenshots + logcat [skip-ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            sleep 10
          done
