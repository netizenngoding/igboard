name: ci-probe
on:
  push:
    branches: ["**"]
permissions:
  contents: write
concurrency:
  group: ci-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Report environment
        run: |
          {
            echo "run_at=$(date -u +%FT%TZ)"
            echo "sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "runner=$(uname -a)"
            echo "disk=$(df -h / | tail -1)"
          } > build/.ci-probe
          head -c 200 build/.ci-probe
      - name: Commit back
        run: |
          git config user.name "ci-probe"
          git config user.email "ci-probe@users.noreply.github.com"
          git add -A build/.ci-probe
          git commit -m "ci-probe: runner reachable" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
